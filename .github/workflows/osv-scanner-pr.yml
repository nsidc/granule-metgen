name: OSV-Scanner PR scan

# Scans poetry.lock for known vulnerabilities and reports only those introduced
# by the pull request, so pre-existing findings don't block unrelated work.
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-pr:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.0"
