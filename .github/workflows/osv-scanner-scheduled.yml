name: Security scan

# Full scan of poetry.lock. Results are published to the repository's Security
# tab, in the Code scanning section. They travel as SARIF, a standard JSON
# format for analysis results that GitHub knows how to render.
#
# Unlike the PR scan, this has no baseline to compare against, so it fails when
# any known vulnerability exists. That is what turns the README badge red, and
# it stays red until the findings are fixed or dismissed.
on:
  schedule:
    - cron: "30 12 * * 1" # Mondays, 12:30 UTC
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write # required to publish results to the Security tab

jobs:
  scan-scheduled:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0"
