name: OSV-Scanner scheduled scan

# Full scan of poetry.lock. Results are uploaded as SARIF and appear under
# Security -> Code scanning.
on:
  schedule:
    - cron: "30 12 * * 1"
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-scheduled:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0"
