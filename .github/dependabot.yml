version: 2

updates:
  # Python dependencies. The "pip" ecosystem understands Poetry projects and
  # updates both pyproject.toml and poetry.lock.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Caps how many version-update PRs stay open at once. Security-update PRs
    # ignore this cap and are unlimited. 5 is GitHub's default; use 0 to pause
    # version updates for this ecosystem.
    open-pull-requests-limit: 5
    groups:
      # Batch routine minor/patch bumps into a single weekly PR. Major bumps are
      # left ungrouped so each gets its own PR and review.
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Actions used by the build-test and publish workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"
